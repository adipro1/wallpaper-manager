<!doctype html>
<!--
  Wallpaper Manager shader runner: plays Shadertoy-style fragment shaders.
  The app writes one copy of this page per shader, with the code and the
  options in the "config" block.
  Uniforms: iResolution, iTime, iTimeDelta, iFrame, iMouse, iDate, iChannel0 (audio, 512x2),
  iChannel1-3 (pictures chosen with "// @image"), iChannelResolution, iPointer (mouse 0..1, also
  without a button) and one uniform per "// @slider / @color / @checkbox" setting.
-->
<html>
<head>
<meta charset="utf-8">
<title>shader</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #error { position: fixed; left: 16px; top: 16px; right: 16px; color: #ff8a80; font: 14px Consolas, monospace;
           white-space: pre-wrap; background: rgba(0,0,0,.75); padding: 12px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="error"></div>
<script id="config" type="application/json">/*__CONFIG__*/</script>
<script>
"use strict";
const config = Object.assign({ fps: 60, scale: 1 }, JSON.parse(document.getElementById("config").textContent || "{}"));
const canvas = document.getElementById("c");
const errorBox = document.getElementById("error");
const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });

function fail(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
  document.title = "error: " + message.split("\n").slice(0, 3).join(" | ");
}

const vertexSource = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

// Settings declared in the code ("// @slider speed 0 2 1"): [{name, type, value, channel}].
const properties = config.properties || [];
const values = {};
for (const p of properties) values[p.name] = p.value;
const declarations = properties.map(p =>
  p.type === "slider" ? `uniform float ${p.name};` :
  p.type === "color" ? `uniform vec3 ${p.name};` :
  p.type === "checkbox" ? `uniform bool ${p.name};` :
  p.type === "image" ? `#define ${p.name} iChannel${p.channel}` : "").join("\n");

const header = `#version 300 es
precision highp float;
precision highp int;
uniform vec3 iResolution;
uniform float iTime;
uniform float iTimeDelta;
uniform int iFrame;
uniform vec4 iMouse;
uniform vec4 iDate;
uniform vec2 iPointer;
uniform sampler2D iChannel0;
uniform sampler2D iChannel1;
uniform sampler2D iChannel2;
uniform sampler2D iChannel3;
uniform vec3 iChannelResolution[4];
out vec4 wpmFragColor;
${declarations}
`;
const footer = `
void main() {
  vec4 color = vec4(0.0, 0.0, 0.0, 1.0);
  mainImage(color, gl_FragCoord.xy);
  wpmFragColor = vec4(color.rgb, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const headerLines = header.split("\n").length - 1;
    // Report line numbers as the user sees them in the editor.
    const log = (gl.getShaderInfoLog(shader) || "unknown error").replace(/ERROR: 0:(\d+)/g,
      (_, line) => "line " + Math.max(1, Number(line) - headerLines));
    throw new Error(log.trim());
  }
  return shader;
}

let program, uniforms = {}, audioTexture;
const channelSize = [[512, 2], [1, 1], [1, 1], [1, 1]];
const audio = new Uint8Array(512 * 2);

function setup() {
  if (!gl) throw new Error("WebGL 2 is not available on this PC");
  const code = String(config.code || "");
  if (!/void\s+mainImage\s*\(/.test(code)) throw new Error("The shader needs a mainImage(out vec4 fragColor, in vec2 fragCoord) function");
  program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, header + code + footer));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const location = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(location);
  gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);

  for (const name of ["iResolution", "iTime", "iTimeDelta", "iFrame", "iMouse", "iDate", "iPointer", "iChannel0",
                      "iChannel1", "iChannel2", "iChannel3", "iChannelResolution"]) {
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  for (const p of properties) uniforms["p:" + p.name] = gl.getUniformLocation(program, p.name);
  audioTexture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, audioTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  uploadAudio();
  gl.uniform1i(uniforms.iChannel0, 0);
  for (let channel = 1; channel <= 3; channel++) setupPicture(channel);
}

// Pictures for iChannel1-3 come as data: URLs (file:// images can't be used by WebGL).
function setupPicture(channel) {
  const texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + channel);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([128, 128, 128, 255]));
  gl.uniform1i(uniforms["iChannel" + channel], channel);
  const source = (config.images || {})[channel];
  if (!source) return;
  const image = new Image();
  image.onload = () => {
    gl.activeTexture(gl.TEXTURE0 + channel);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    channelSize[channel] = [image.width, image.height];
    gl.activeTexture(gl.TEXTURE0);
  };
  image.src = source;
}

// Settings changed in the app arrive like Lively's (livelyPropertyListener(name, value)).
window.livelyPropertyListener = (name, value) => { if (name in values) values[name] = value; };

function hexColor(text) {
  const n = parseInt(String(text || "#000000").replace("#", "").slice(-6), 16) || 0;
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}

function setProperties() {
  for (const p of properties) {
    const location = uniforms["p:" + p.name];
    if (!location) continue;
    const v = values[p.name];
    if (p.type === "slider") gl.uniform1f(location, Number(v) || 0);
    else if (p.type === "color") gl.uniform3fv(location, hexColor(v));
    else if (p.type === "checkbox") gl.uniform1i(location, v ? 1 : 0);
  }
}

function uploadAudio() {
  gl.bindTexture(gl.TEXTURE_2D, audioTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 512, 2, 0, gl.RED, gl.UNSIGNED_BYTE, audio);
}

// Audio levels from the app: 128 bands, 0..1 (same call Lively uses, so its visualizers work too).
// Row 0 of iChannel0 is the spectrum, row 1 a simple waveform made from it, as on Shadertoy.
function onAudio(bands) {
  if (!bands || !bands.length) return;
  for (let i = 0; i < 512; i++) {
    const v = bands[Math.min(bands.length - 1, Math.floor(i * bands.length / 512))];
    audio[i] = Math.max(0, Math.min(255, v * 255));
    audio[512 + i] = 128 + Math.sin(i * 0.2 + performance.now() / 120) * v * 120;
  }
  if (program) uploadAudio();
}
window.livelyAudioListener = onAudio;
window.wpm = Object.assign(window.wpm || {}, { onAudio });

// Mouse, Shadertoy style: xy = position while a button is down, zw = where it was pressed (negative when released).
const mouse = [0, 0, 0, 0];
function toPixels(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * canvas.width / r.width, (r.bottom - e.clientY) * canvas.height / r.height];
}
addEventListener("mousedown", e => { const [x, y] = toPixels(e); mouse[0] = x; mouse[1] = y; mouse[2] = x; mouse[3] = y; });
addEventListener("mousemove", e => { if (e.buttons & 1) { const [x, y] = toPixels(e); mouse[0] = x; mouse[1] = y; } });
addEventListener("mouseup", () => { mouse[2] = -Math.abs(mouse[2]); mouse[3] = -Math.abs(mouse[3]); });
const pointer = [0.5, 0.5];
addEventListener("mousemove", e => { pointer[0] = e.clientX / innerWidth; pointer[1] = 1 - e.clientY / innerHeight; });

let start = performance.now(), last = start, frame = 0, lastDrawn = 0;
function draw(now) {
  requestAnimationFrame(draw);
  if (now - lastDrawn < 1000 / config.fps - 1) return;
  lastDrawn = now;
  const w = Math.max(1, Math.floor(innerWidth * devicePixelRatio * config.scale));
  const h = Math.max(1, Math.floor(innerHeight * devicePixelRatio * config.scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  const d = new Date();
  gl.uniform3f(uniforms.iResolution, w, h, 1);
  gl.uniform1f(uniforms.iTime, (now - start) / 1000);
  gl.uniform1f(uniforms.iTimeDelta, (now - last) / 1000);
  gl.uniform1i(uniforms.iFrame, frame++);
  gl.uniform4f(uniforms.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
  gl.uniform2f(uniforms.iPointer, pointer[0], pointer[1]);
  gl.uniform3fv(uniforms.iChannelResolution, channelSize.flatMap(([cw, ch]) => [cw, ch, 1]));
  setProperties();
  gl.uniform4f(uniforms.iDate, d.getFullYear(), d.getMonth(), d.getDate(),
    d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  last = now;
}

try {
  setup();
  document.title = "ok";
  requestAnimationFrame(draw);
} catch (e) {
  fail(String(e.message || e));
}
</script>
</body>
</html>
