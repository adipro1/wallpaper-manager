name: Build

on:
  push:
    branches: [master, kotlin-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # "Run workflow" button: builds without publishing a release

permissions:
  contents: write  # needed to publish releases

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
          cache: gradle
      - name: Fetch libmpv (for the video tests)
        run: ./gradlew getLibmpv --console=plain
      - run: ./gradlew check --console=plain
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports
          path: desktop/build/reports/tests

  package:
    # Only for version tags (v1.2.3) or a manual run.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
          cache: gradle

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' build.gradle.kts)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != app version $version"; exit 1; }

      - run: ./gradlew getLibmpv getYtDlp --console=plain
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - run: ./gradlew zipDistributable installer --console=plain

      - uses: actions/upload-artifact@v6
        with:
          name: WallpaperManager
          path: |
            dist/*.zip
            dist/*-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: .
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*-setup.exe --title "Wallpaper Manager ${GITHUB_REF_NAME#v}" --generate-notes
